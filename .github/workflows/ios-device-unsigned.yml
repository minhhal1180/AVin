name: iPhone IPA build (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build device IPA and validate both extensions
        run: bash apple/ci/build-device-unsigned.sh
      - name: Save device IPA and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VNAnvia-iPhone-unsigned
          retention-days: 3
          if-no-files-found: warn
          path: |
            build/ios-device/**/VNAnvia-device-unsigned.ipa
            build/ios-device/**/build-info.json
            build/ios-device/**/ipa-validation.json
            build/ios-device/**/SHA256SUMS.txt
            build/ios-device/**/logs/*.log
