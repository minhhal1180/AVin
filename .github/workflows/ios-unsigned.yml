name: iOS simulator build (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build and test app and extensions
        run: bash apple/ci/build-ios.sh
      - name: Save build output and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VNAnvia-iOS-simulator
          retention-days: 3
          if-no-files-found: warn
          path: |
            build/ios-cloud/**/VNAnvia-simulator.app.zip
            build/ios-cloud/**/build-info.json
            build/ios-cloud/**/SHA256SUMS.txt
            build/ios-cloud/**/logs/*.log
